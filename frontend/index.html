<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />

    <title>Computer Hardware Store | Gaming PCs & Professional Workstations</title>
    <meta
      name="description"
      content="Premium computer hardware, custom gaming PCs, professional workstations and accessories — specified, built and supported in Tiruchirappalli."
    />

    <!-- Baseline Open Graph. usePageMeta rewrites these per route, but a
         crawler that does not execute JS only ever sees what is here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NSK Computer Zone" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.nskcomputerzone.com/" />
    <meta
      property="og:title"
      content="Computer Hardware Store | Gaming PCs &amp; Professional Workstations"
    />
    <meta
      property="og:description"
      content="Premium computer hardware, custom gaming PCs, professional workstations and accessories — specified, built and supported in Tiruchirappalli."
    />
    <meta property="og:image" content="https://www.nskcomputerzone.com/images/og/og-default.png" />
    <meta property="og:image:alt" content="NSK Computer Zone — computer hardware showroom" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://www.nskcomputerzone.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts are fetched by the stylesheet; preconnect so the round trip
         overlaps with the JS download rather than following it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This site needs JavaScript. Call us on +91 97914 30774 or visit the showroom in
      Tiruchirappalli.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
