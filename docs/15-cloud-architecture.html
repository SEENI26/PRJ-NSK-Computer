<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NSK Computer Zone — Cloud Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .zonelabel { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: 0.08em; }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
</style>
<main>
  <svg viewBox="0 0 1000 830" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">NSK Computer Zone production architecture</title>
    <desc id="diagram-desc">
      Layered topology: clients reach Cloudflare, which proxies to a single Ubuntu origin running Nginx.
      Nginx routes to Next.js for pages and Laravel for the API. Both share a private data tier of MySQL,
      Redis and R2 object storage, and Laravel calls the Anthropic and SMTP services outbound.
    </desc>

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="40" y="30">NSK Computer Zone — Production Architecture</text>
    <text class="small" x="40" y="50">Cloudflare edge → single Ubuntu origin (Nginx) → Next.js 15 SSR + Laravel 12 API → private data tier</text>

    <!-- ══ connectors drawn first so arrows sit behind the nodes ══ -->

    <!-- clients → cloudflare -->
    <path class="edge" d="M160,152 L160,190" marker-end="url(#arrow)" />
    <path class="edge" d="M380,152 L380,190" marker-end="url(#arrow)" />
    <path class="edge" d="M620,152 L620,190" marker-end="url(#arrow)" />
    <path class="edge" d="M850,152 L850,190" marker-end="url(#arrow)" />

    <!-- cloudflare → nginx -->
    <path class="edge" d="M500,278 L500,338" marker-end="url(#arrow)" />

    <!-- nginx → app processes -->
    <path class="edge" d="M270,388 L270,414" marker-end="url(#arrow)" />
    <path class="edge" d="M730,388 L730,414" marker-end="url(#arrow)" />

    <!-- next.js → laravel (server-side data fetch) -->
    <path class="edge" d="M482,446 L518,446" marker-end="url(#arrow)" />

    <!-- app → sub-processes -->
    <path class="edge" d="M270,478 L270,504" marker-end="url(#arrow)" />
    <path class="edge" d="M730,478 L730,504" marker-end="url(#arrow)" />

    <!-- shared bus from the app tier down to data + external -->
    <path class="edge" d="M730,548 L730,578" />
    <path class="edge" d="M140,578 L888,578" />
    <path class="edge" d="M140,578 L140,662" marker-end="url(#arrow)" />
    <path class="edge" d="M316,578 L316,662" marker-end="url(#arrow)" />
    <path class="edge" d="M497,578 L497,662" marker-end="url(#arrow)" />
    <path class="edge" d="M719,578 L719,662" marker-end="url(#arrow)" />
    <path class="edge" d="M888,578 L888,662" marker-end="url(#arrow)" />

    <!-- R2 served back through the CDN -->
    <path class="edge" stroke-dasharray="4 4" d="M582,690 L610,690 L610,236 L822,236" marker-end="url(#arrow)" />

    <!-- ══ zone 1 — clients ══ -->
    <rect class="zone" x="40" y="66" width="920" height="86" rx="10" />
    <text class="zonelabel" x="54" y="86">CLIENTS</text>

    <rect class="node input" x="60" y="96" width="200" height="46" rx="7" />
    <text class="label" x="160" y="118" text-anchor="middle">Desktop browser</text>
    <text class="small" x="160" y="134" text-anchor="middle">Chrome · Safari · Edge</text>

    <rect class="node input" x="280" y="96" width="200" height="46" rx="7" />
    <text class="label" x="380" y="118" text-anchor="middle">Mobile / tablet</text>
    <text class="small" x="380" y="134" text-anchor="middle">Responsive, 360px up</text>

    <rect class="node input" x="500" y="96" width="240" height="46" rx="7" />
    <text class="label" x="620" y="118" text-anchor="middle">Search &amp; AI crawlers</text>
    <text class="small" x="620" y="134" text-anchor="middle">Googlebot · GPTBot · ClaudeBot</text>

    <rect class="node input" x="760" y="96" width="180" height="46" rx="7" />
    <text class="label" x="850" y="118" text-anchor="middle">WhatsApp / tel:</text>
    <text class="small" x="850" y="134" text-anchor="middle">Deep links out</text>

    <!-- ══ zone 2 — cloudflare ══ -->
    <rect class="zone" x="40" y="190" width="920" height="88" rx="10" />
    <text class="zonelabel" x="54" y="210">CLOUDFLARE EDGE — PROXIED DNS, ANYCAST</text>

    <rect class="node neutral" x="60" y="220" width="190" height="46" rx="7" />
    <text class="label" x="155" y="242" text-anchor="middle">CDN cache</text>
    <text class="small" x="155" y="258" text-anchor="middle">Static, images, ISR HTML</text>

    <rect class="node neutral" x="270" y="220" width="190" height="46" rx="7" />
    <text class="label" x="365" y="242" text-anchor="middle">WAF + bot rules</text>
    <text class="small" x="365" y="258" text-anchor="middle">OWASP set, managed</text>

    <rect class="node neutral" x="480" y="220" width="190" height="46" rx="7" />
    <text class="label" x="575" y="242" text-anchor="middle">DDoS + rate limit</text>
    <text class="small" x="575" y="258" text-anchor="middle">L3–L7, per-path rules</text>

    <rect class="node neutral" x="690" y="220" width="250" height="46" rx="7" />
    <text class="label" x="815" y="242" text-anchor="middle">TLS 1.3 · HSTS · Brotli</text>
    <text class="small" x="815" y="258" text-anchor="middle">Full (strict) to origin</text>

    <!-- ══ zone 3 — origin ══ -->
    <rect class="zone" x="40" y="304" width="920" height="264" rx="10" />
    <text class="zonelabel" x="54" y="324">ORIGIN — UBUNTU 24.04 LTS · UFW: 443 FROM CLOUDFLARE ONLY</text>

    <rect class="node neutral" x="60" y="338" width="880" height="50" rx="7" />
    <text class="label" x="500" y="360" text-anchor="middle">Nginx — reverse proxy, TLS termination, gzip/brotli, static file serving</text>
    <text class="small" x="500" y="378" text-anchor="middle">/ → Next.js (127.0.0.1:3000) · /api → PHP-FPM socket · /_next/static → served from disk</text>

    <rect class="node process" x="60" y="414" width="422" height="64" rx="7" />
    <text class="label" x="271" y="440" text-anchor="middle">Next.js 15 — SSR / ISR</text>
    <text class="small" x="271" y="458" text-anchor="middle">Node 20 under PM2 (cluster mode)</text>
    <text class="small" x="271" y="472" text-anchor="middle">App Router · React 19 · static + revalidate</text>

    <rect class="node process" x="518" y="414" width="422" height="64" rx="7" />
    <text class="label" x="729" y="440" text-anchor="middle">Laravel 12 — REST API</text>
    <text class="small" x="729" y="458" text-anchor="middle">PHP 8.3 FPM · Sanctum cookie auth</text>
    <text class="small" x="729" y="472" text-anchor="middle">Policies · FormRequests · rate limiters</text>

    <rect class="node storage" x="60" y="504" width="422" height="44" rx="7" />
    <text class="label" x="271" y="524" text-anchor="middle">ISR / Data cache (disk)</text>
    <text class="small" x="271" y="540" text-anchor="middle">.next/cache — revalidated per-route</text>

    <rect class="node process" x="518" y="504" width="422" height="44" rx="7" />
    <text class="label" x="729" y="524" text-anchor="middle">Queue workers (Supervisor)</text>
    <text class="small" x="729" y="540" text-anchor="middle">Mail, exports, AI follow-up, scheduled jobs</text>

    <!-- ══ zone 4 — data tier ══ -->
    <rect class="zone" x="40" y="600" width="560" height="122" rx="10" />
    <text class="zonelabel" x="54" y="620">DATA TIER — PRIVATE NETWORK, NO PUBLIC INGRESS</text>

    <rect class="node storage" x="60" y="662" width="160" height="46" rx="7" />
    <text class="label" x="140" y="684" text-anchor="middle">MySQL 8</text>
    <text class="small" x="140" y="700" text-anchor="middle">22 tables · daily PITR</text>

    <rect class="node storage" x="236" y="662" width="160" height="46" rx="7" />
    <text class="label" x="316" y="684" text-anchor="middle">Redis 7</text>
    <text class="small" x="316" y="700" text-anchor="middle">cache · queue · session</text>

    <rect class="node storage" x="412" y="662" width="170" height="46" rx="7" />
    <text class="label" x="497" y="684" text-anchor="middle">Cloudflare R2</text>
    <text class="small" x="497" y="700" text-anchor="middle">media, attachments</text>

    <!-- ══ zone 5 — external ══ -->
    <rect class="zone" x="624" y="600" width="336" height="122" rx="10" />
    <text class="zonelabel" x="638" y="620">EXTERNAL SERVICES — EGRESS ONLY</text>

    <rect class="node external" x="644" y="662" width="150" height="46" rx="7" />
    <text class="label" x="719" y="684" text-anchor="middle">Anthropic API</text>
    <text class="small" x="719" y="700" text-anchor="middle">AI assistant</text>

    <rect class="node external" x="810" y="662" width="150" height="46" rx="7" />
    <text class="label" x="885" y="684" text-anchor="middle">SMTP relay</text>
    <text class="small" x="885" y="700" text-anchor="middle">alerts + auto-reply</text>

    <!-- ══ edge labels ══ -->
    <text class="small" x="500" y="302" text-anchor="middle">HTTPS, origin-locked</text>
    <text class="small" x="500" y="440" text-anchor="middle">server fetch</text>
    <text class="small" x="620" y="228" text-anchor="middle">media via CDN</text>

    <!-- ══ legend ══ -->
    <rect class="node input" x="60" y="756" width="16" height="16" rx="3" />
    <text class="small" x="84" y="769">Client</text>

    <rect class="node neutral" x="160" y="756" width="16" height="16" rx="3" />
    <text class="small" x="184" y="769">Edge / proxy</text>

    <rect class="node process" x="290" y="756" width="16" height="16" rx="3" />
    <text class="small" x="314" y="769">Application process</text>

    <rect class="node storage" x="460" y="756" width="16" height="16" rx="3" />
    <text class="small" x="484" y="769">Data / storage</text>

    <rect class="node external" x="610" y="756" width="16" height="16" rx="3" />
    <text class="small" x="634" y="769">Third-party service</text>

    <path class="edge" stroke-dasharray="4 4" d="M770,764 L806,764" />
    <text class="small" x="814" y="769">Asset served back through the CDN</text>
  </svg>
</main>
